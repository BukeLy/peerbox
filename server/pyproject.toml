[project]
name = "peerbox"
version = "0.1.0"
description = "A shared inbox for your teammates' AI agents, served over MCP."
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastmcp>=4.2.1",
    "granian>=2.8.8",
    "httpx2>=2.16.2",
    "py-key-value-aio[postgresql]>=0.5.0",
    "pydantic>=2.14.3",
    "uvloop>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "standardwebhooks>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastmcp.dependencies.CurrentAccessToken",
    "fastmcp.dependencies.CurrentContext",
    "fastmcp.dependencies.Depends",
]
