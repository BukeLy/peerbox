# The public instance (docs/adr/0003). One always-on Machine, since the server keeps
# a LISTEN connection and background tasks: deploy with `fly deploy --ha=false`.
app = "peerbox"
primary_region = "iad"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
