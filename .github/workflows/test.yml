name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      # Attachments' bucket. minio/minio is no longer on Docker Hub; this image runs
      # the server without a command (which services can't pass) and makes the bucket.
      minio:
        image: bitnamilegacy/minio:2025.5.24
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: peerbox
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff@0.17.6 check .
      - run: uvx ruff@0.17.6 format --check .
      - run: uv run --locked pytest
        env:
          # No TLS to negotiate here. Negotiating also fails a test whose pool closes
          # while asyncpg still connects to cancel a query, with "unexpected
          # connection_lost() call".
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
